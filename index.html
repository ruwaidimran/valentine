<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Be My Valentine?</title>
<meta name="description" content="A cute little Valentine page." />
<style>
:root{
--bg1:#ff5ea8;
--bg2:#ffb3d6;
--card:#ffffffee;
--text:#1f1f1f;
--yes:#22c55e;
--yes-dark:#16a34a;
--no:#ef4444;
--shadow: 0 20px 60px rgba(0,0,0,.18);
}

*{ box-sizing:border-box; }
body{
margin:0;
font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
color:var(--text);
min-height:100vh;
display:grid;
place-items:center;
background:
radial-gradient(1200px 800px at 20% 20%, #fff4, transparent 60%),
radial-gradient(1000px 700px at 80% 30%, #fff3, transparent 55%),
linear-gradient(135deg, var(--bg1), var(--bg2));
overflow:hidden;
}

/* floating hearts */
.hearts{
position:fixed;
inset:0;
pointer-events:none;
opacity:.7;
filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
}
.heart{
position:absolute;
width:18px; height:18px;
transform: rotate(45deg);
animation: floatUp linear infinite;
background:#fff;
border-radius:4px;
}
.heart::before, .heart::after{
content:"";
position:absolute;
width:18px; height:18px;
background:#fff;
border-radius:50%;
}
.heart::before{ left:-9px; top:0; }
.heart::after{ top:-9px; left:0; }

@keyframes floatUp{
from{ transform:translateY(110vh) rotate(45deg) scale(.9); opacity:0; }
10%{ opacity:.9; }
to{ transform:translateY(-20vh) rotate(45deg) scale(1.15); opacity:0; }
}

.wrap{
width:min(720px, 92vw);
padding:28px;
position:relative;
}

.card{
background:var(--card);
border:1px solid rgba(255,255,255,.55);
border-radius:26px;
box-shadow:var(--shadow);
padding:34px 28px;
backdrop-filter: blur(10px);
text-align:center;
}

.badge{
display:inline-flex;
align-items:center;
gap:.5rem;
padding:8px 14px;
background:rgba(255,255,255,.65);
border:1px solid rgba(255,255,255,.8);
border-radius:999px;
font-weight:700;
letter-spacing:.2px;
}

h1{
margin:18px 0 8px;
font-size: clamp(34px, 4.8vw, 56px);
line-height:1.03;
}
p{
margin:0 auto 22px;
max-width:52ch;
font-size: clamp(16px, 2.1vw, 18px);
opacity:.9;
}

.nameRow{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin:18px 0 22px;
}
.input{
width:min(340px, 88vw);
border-radius:14px;
border:1px solid rgba(0,0,0,.12);
padding:12px 14px;
font-size:16px;
outline:none;
box-shadow: 0 8px 16px rgba(0,0,0,.06) inset;
background:rgba(255,255,255,.9);
}
.input:focus{
border-color: rgba(255,94,168,.55);
box-shadow: 0 0 0 4px rgba(255,94,168,.18);
}

.btnRow{
display:flex;
gap:14px;
justify-content:center;
flex-wrap:wrap;
margin-top:10px;
position:relative;
height:72px; /* keeps space for dodging */
}
button{
border:none;
border-radius:16px;
padding:14px 18px;
font-size:18px;
font-weight:800;
cursor:pointer;
transition: transform .15s ease, filter .15s ease;
user-select:none;
}
button:active{ transform: scale(.98); }

#yesBtn{
background:linear-gradient(180deg, var(--yes), var(--yes-dark));
color:white;
box-shadow: 0 16px 24px rgba(34,197,94,.28);
min-width:160px;
}
#yesBtn:hover{ filter: brightness(1.03); }

#noBtn{
background:linear-gradient(180deg, #ff6b6b, var(--no));
color:white;
box-shadow: 0 16px 24px rgba(239,68,68,.25);
min-width:160px;
position:absolute;
left:50%;
transform: translateX(90px); /* start slightly right of yes */
}

.small{
margin-top:18px;
font-size:13px;
opacity:.75;
}

/* modal */
.modalBackdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
place-items:center;
padding:22px;
}
.modal{
width:min(560px, 95vw);
background:white;
border-radius:22px;
box-shadow:var(--shadow);
padding:24px 20px;
text-align:center;
position:relative;
overflow:hidden;
}
.modal h2{
margin:6px 0 6px;
font-size: clamp(24px, 3.8vw, 36px);
}
.modal p{
margin:0 auto 16px;
max-width:50ch;
}
.close{
position:absolute;
right:10px; top:10px;
width:38px; height:38px;
border-radius:12px;
background:rgba(0,0,0,.06);
font-weight:900;
cursor:pointer;
}

/* confetti canvas */
canvas{
position:fixed;
inset:0;
pointer-events:none;
display:none;
}

@media (prefers-reduced-motion: reduce){
.heart{ animation: none; display:none; }
button{ transition:none; }
}
</style>
</head>
<body>
<div class="hearts" aria-hidden="true" id="hearts"></div>
<canvas id="confetti"></canvas>

<main class="wrap">
<section class="card">
<div class="badge">💌 Valentine Request from Ruwaid :D</div>
<h1 id="title">Will you be my Valentine?</h1>
<p id="subtitle">Type your name so I can ask properly (and dramatically).</p>

<div class="nameRow">
<input class="input" id="theirName" maxlength="30" placeholder="Your name (optional)" />
</div>

<div class="btnRow" id="btnRow">
<button id="yesBtn" type="button">Yes 💖</button>
<button id="noBtn" type="button" aria-label="No">No </button>
</div>

<div class="small">Tip: click the green button :p </div>
</section>
</main>

<div class="modalBackdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal">
<button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
<div style="font-size:44px; margin-top:6px;">🥰</div>
<h2 id="modalTitle">YAY!</h2>
<p id="modalText">Best. Valentine. Ever.</p>
</div>
</div>

<script>
// ----- Floating hearts background -----
const heartsHost = document.getElementById("hearts");
const HEART_COUNT = 18;

function rand(min, max){ return Math.random() * (max - min) + min; }

for(let i=0;i<HEART_COUNT;i++){
const h = document.createElement("div");
h.className = "heart";
h.style.left = rand(0, 100) + "vw";
h.style.animationDuration = rand(6, 12) + "s";
h.style.animationDelay = rand(-12, 0) + "s";
h.style.opacity = rand(.35, .9);
h.style.transform = `rotate(45deg) scale(${rand(.7, 1.35)})`;
heartsHost.appendChild(h);
}

// ----- Personalize title by name -----
const theirName = document.getElementById("theirName");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");

function updateText(){
const name = theirName.value.trim();
if(name){
title.textContent = `${name}, will you be my Valentine?`;
subtitle.textContent = "No pressure… but also, yes pressure 😌";
}else{
title.textContent = "Will you be my Valentine?";
subtitle.textContent = "Type your name so I can ask properly (and dramatically).";
}
}
theirName.addEventListener("input", updateText);

// ----- No button dodges -----
const noBtn = document.getElementById("noBtn");
const btnRow = document.getElementById("btnRow");

function moveNoButton(){
const rect = btnRow.getBoundingClientRect();
const btnRect = noBtn.getBoundingClientRect();

// keep it within btnRow bounds
const padding = 6;
const maxX = rect.width - btnRect.width - padding;
const maxY = rect.height - btnRect.height - padding;

const x = Math.max(padding, Math.min(maxX, rand(padding, maxX)));
const y = Math.max(padding, Math.min(maxY, rand(padding, maxY)));

noBtn.style.left = x + "px";
noBtn.style.top = y + "px";
noBtn.style.transform = "translateX(0)"; // stop initial translate after first move
}

// Initialize position
requestAnimationFrame(() => {
// place it initially near the right side of the row
noBtn.style.top = "0px";
noBtn.style.left = (btnRow.clientWidth/2 + 90) + "px";
});

// Dodge if mouse gets close
btnRow.addEventListener("mousemove", (e) => {
const btn = noBtn.getBoundingClientRect();
const distX = Math.abs(e.clientX - (btn.left + btn.width/2));
const distY = Math.abs(e.clientY - (btn.top + btn.height/2));
if(distX < 120 && distY < 70){
moveNoButton();
}
});

// Also dodge on focus (keyboard users)
noBtn.addEventListener("focus", () => moveNoButton());
noBtn.addEventListener("mouseenter", () => moveNoButton());
noBtn.addEventListener("click", (e) => {
e.preventDefault();
moveNoButton();
});

// ----- Yes opens modal + confetti -----
const yesBtn = document.getElementById("yesBtn");
const modalBackdrop = document.getElementById("modalBackdrop");
const closeModal = document.getElementById("closeModal");
const modalText = document.getElementById("modalText");
const copyBtn = document.getElementById("copyBtn");

function openModal(){
const name = theirName.value.trim();
modalText.textContent = name
? `Okay ${name}… you just made my whole day 💘`
: "You just made my whole day 💘";
modalBackdrop.style.display = "grid";
startConfetti();
}
function hideModal(){
modalBackdrop.style.display = "none";
stopConfetti();
}

yesBtn.addEventListener("click", openModal);
closeModal.addEventListener("click", hideModal);
modalBackdrop.addEventListener("click", (e) => {
if(e.target === modalBackdrop) hideModal();
});
document.addEventListener("keydown", (e) => {
if(e.key === "Escape" && modalBackdrop.style.display === "grid") hideModal();
});


// ----- Confetti (tiny canvas) -----
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let confettiRAF = null;
let pieces = [];

function resize(){
canvas.width = window.innerWidth * devicePixelRatio;
canvas.height = window.innerHeight * devicePixelRatio;
}
window.addEventListener("resize", resize);

function makePieces(){
const count = 160;
pieces = Array.from({length: count}, () => ({
x: rand(0, canvas.width),
y: rand(-canvas.height, 0),
r: rand(5, 10) * devicePixelRatio,
vx: rand(-2, 2) * devicePixelRatio,
vy: rand(2, 6) * devicePixelRatio,
rot: rand(0, Math.PI*2),
vr: rand(-.15, .15),
}));
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(const p of pieces){
p.x += p.vx;
p.y += p.vy;
p.rot += p.vr;

// wrap
if(p.y > canvas.height + 30) { p.y = -30; p.x = rand(0, canvas.width); }
if(p.x < -30) p.x = canvas.width + 30;
if(p.x > canvas.width + 30) p.x = -30;

ctx.save();
ctx.translate(p.x, p.y);
ctx.rotate(p.rot);
// random-ish festive color each frame based on position (no fixed palette needed)
const hue = (p.x / canvas.width) * 360;
ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r);
ctx.restore();
}
confettiRAF = requestAnimationFrame(draw);
}

function startConfetti(){
canvas.style.display = "block";
resize();
makePieces();
if(confettiRAF) cancelAnimationFrame(confettiRAF);
draw();
}
function stopConfetti(){
canvas.style.display = "none";
if(confettiRAF) cancelAnimationFrame(confettiRAF);
confettiRAF = null;
}
</script>
</body>
</html>
